name: ALVSIA AI UNCENSORED Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android API 37 platform
        run: |
          yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build debug APK
        id: debug
        continue-on-error: true
        run: gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/alvsia-ai-build.log
      - name: Capture temporary build diagnostic
        if: steps.debug.outcome == 'failure'
        run: |
          tail -n 240 /tmp/alvsia-ai-build.log > BUILD_FAILURE_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE_DIAGNOSTIC.txt
          git commit -m "ci: temporary build diagnostic [skip ci]"
          git push
          exit 1
      - name: Build release APK
        id: release
        continue-on-error: true
        run: gradle --no-daemon :app:assembleRelease --stacktrace --console=plain 2>&1 | tee /tmp/alvsia-ai-release.log
      - name: Capture temporary release diagnostic
        if: steps.release.outcome == 'failure'
        run: |
          tail -n 300 /tmp/alvsia-ai-release.log > RELEASE_FAILURE_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_FAILURE_DIAGNOSTIC.txt
          git commit -m "ci: temporary release diagnostic [skip ci]"
          git push
          exit 1
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: alvsia-ai-uncensored-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
