name: ALVSIA AI UNCENSORED Android
# Release signing accepts normalized Base64 keystore secrets.
# Release gate: build -> sign -> verify -> artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android API 37 platform
        run: |
          yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build debug APK
        id: debug
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/alvsia-ai-build.log
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace --console=plain

      - name: Detect signing configuration
        id: signing
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          B64="${ALVSIA_KEYSTORE_BASE64:-}"
          B64="$(printf '%s' "$B64" | tr -d '[:space:]')"
          STOREPASS="${ALVSIA_KEYSTORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
          if { [ -n "$B64" ] || [ -n "${CM_KEYSTORE:-}" ]; } &&
             [ -n "$STOREPASS" ] &&
             { [ -z "$B64" ] || [ "$(( ${#B64} % 4 ))" != "1" ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing configuration: available (keystore + store password present)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete; final signed APK will not be published."
          fi

      - name: Sign and verify final release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          INPUT="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$INPUT"

          KS="$RUNNER_TEMP/alvsia-ai-release.jks"
          KSPASS="${ALVSIA_KEYSTORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
          ALIAS="${ALVSIA_KEY_ALIAS:-${CM_KEY_ALIAS:-alvsia}}"
          KEYPASS="${ALVSIA_KEY_PASSWORD:-${CM_KEY_PASSWORD:-$KSPASS}}"

          decode_b64_secret() {
            local raw="$1"
            raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
            case "$raw" in
              data:*base64,*) raw="${raw#*base64,}" ;;
            esac
            raw="${raw#\"}"
            raw="${raw%\"}"
            raw="${raw#\'}"
            raw="${raw%\'}"
            raw="${raw//-/+}"
            raw="${raw//_//}"
            case $(( ${#raw} % 4 )) in
              2) raw="${raw}==" ;;
              3) raw="${raw}=" ;;
              1) echo "ERROR: invalid Base64 length for signing keystore" >&2; return 1 ;;
            esac
            printf '%s' "$raw" | base64 --decode > "$KS"
          }

          if [ -n "${ALVSIA_KEYSTORE_BASE64:-}" ]; then
            decode_b64_secret "$ALVSIA_KEYSTORE_BASE64"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            if [ -f "$CM_KEYSTORE" ]; then cp "$CM_KEYSTORE" "$KS"; else decode_b64_secret "$CM_KEYSTORE"; fi
          else
            echo "ERROR: no signing keystore secret is available"
            exit 1
          fi

          test -s "$KS"
          echo "Keystore decoded: $(wc -c < "$KS") bytes"
          echo "Expected alias: $ALIAS"

          # Do not print passwords. keytool diagnostics are intentionally visible
          # so a bad existing CI secret is distinguishable from an apksigner error.
          if ! keytool -list -keystore "$KS" -storepass "$KSPASS" >/tmp/alvsia-keytool-list.txt 2>/tmp/alvsia-keytool-error.txt; then
            echo "::error::Existing keystore could not be opened with the configured CI store password."
            sed -E 's/(password|passphrase|storepass|keypass)[^:]*:.*/\1: [REDACTED]/Ig' /tmp/alvsia-keytool-error.txt
            exit 1
          fi

          if ! grep -Fq "Alias name: $ALIAS" /tmp/alvsia-keytool-list.txt; then
            echo "::error::Configured key alias was not found in the existing keystore."
            echo "Available aliases:"
            grep '^Alias name:' /tmp/alvsia-keytool-list.txt | sed 's/^/  /'
            exit 1
          fi

          export KSPASS KEYPASS
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          echo "Signing release APK with existing keystore..."
          "$APKSIGNER" sign             --ks "$KS"             --ks-key-alias "$ALIAS"             --ks-pass env:KSPASS             --key-pass env:KEYPASS             --out validation-artifacts/ALVSIA_AI_UNCENSORED_0.3.0_signed.apk             "$INPUT"

          test -s validation-artifacts/ALVSIA_AI_UNCENSORED_0.3.0_signed.apk
          "$APKSIGNER" verify --verbose --print-certs validation-artifacts/ALVSIA_AI_UNCENSORED_0.3.0_signed.apk
          sha256sum validation-artifacts/ALVSIA_AI_UNCENSORED_0.3.0_signed.apk | tee validation-artifacts/SHA256SUMS.txt

      - name: Upload unsigned release validation APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_AI_UNCENSORED_0.3.0-release-validation
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload final signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_AI_UNCENSORED_0.3.0-final
          path: |
            validation-artifacts/ALVSIA_AI_UNCENSORED_0.3.0_signed.apk
            validation-artifacts/SHA256SUMS.txt
          if-no-files-found: error
